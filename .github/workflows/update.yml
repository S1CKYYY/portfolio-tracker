name: Přepočet portfolia

on:
  schedule:
    # 18:30 UTC ve všední dny: ČNB už vyhlásila kurz, evropské burzy zavřely.
    # US burzy ještě běží, takže poslední den je průběžný a dopočítá se zítra.
    - cron: "30 18 * * 1-5"
  workflow_dispatch:        # ruční spuštění z webu GitHubu

# Workflow commituje výsledek zpět do repozitáře.
permissions:
  contents: write
  pages: write
  id-token: write

# Dva běhy najednou by si přepsaly commit.
concurrency:
  group: portfolio-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Testy běží PŘED přepočtem. Rozbitý engine nesmí publikovat čísla.
      - name: Testy
        run: npm test

      - name: Přepočet a zašifrování
        env:
          PORTFOLIO_PASSPHRASE: ${{ secrets.PORTFOLIO_PASSPHRASE }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node --experimental-strip-types scripts/build-site.ts

      # Pojistka proti tomu, aby se do veřejného webu dostalo něco čitelného.
      - name: Kontrola, že výstup neobsahuje otevřená data
        run: node --experimental-strip-types scripts/check-output.ts

      - name: Commit výsledku
        run: |
          git config user.name "portfolio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json docs/status.json
          if git diff --staged --quiet; then
            echo "beze změny"
          else
            git commit -m "Přepočet $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
